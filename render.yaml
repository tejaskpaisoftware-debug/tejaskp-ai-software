services:
  - type: web
    name: tejaskp-ai-software
    env: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tejaskp-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: tejaskp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: VERCEL
        value: "0"
      - key: NEXTAUTH_URL
        value: https://www.tejaskp.in
      - key: NODE_ENV
        value: production
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: IMAP_HOST
        sync: false
      - key: IMAP_PORT
        sync: false
      - key: TITAN_MAIL_HOST
        sync: false
      - key: TITAN_MAIL_PORT
        sync: false
      - key: TITAN_MAIL_USER
        sync: false
      - key: TITAN_MAIL_PASS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
